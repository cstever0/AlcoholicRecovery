[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crip"
version = "0.1.0"
description = "Cardiomyopathy Recovery Intelligence Platform (CRIP) - Research Proof of Concept"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "CRIP Research Team" }
]
dependencies = [
    "streamlit>=1.36.0",
    "numpy>=1.26.4",
    "pandas>=2.2.0",
    "pydantic>=2.7.0",
    "nibabel>=5.2.1",
    "SimpleITK>=2.3.1",
    "torch>=2.2.0",
    "monai>=1.3.0",
    "scikit-learn>=1.4.0",
    "shap>=0.45.0",
    "plotly>=5.20.0",
    "matplotlib>=3.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --strict-markers"
